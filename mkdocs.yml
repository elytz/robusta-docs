site_name: ROBUSTA ERP — User Guide
site_description: Complete user guide for the ROBUSTA ERP module. One file per sidebar section; deep-link from the in-app help icon to the exact screen anchor.
site_url: https://elytz.github.io/robusta-docs/
site_author: ROBUSTA Team

repo_name: elytz/robusta-docs
repo_url: https://github.com/elytz/robusta-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: brown
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: brown
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mermaid2:
      version: 10.9.0

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link
      toc_depth: 4
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Framework & Setup: framework.md
  - Items: items.md
  - Inventory: inventory.md
  - Procurement (P2P): procurement.md
  - Sales & AR (O2C): sales-ar.md
  - Finance, Tax & Master Data: finance.md
  - General Ledger: gl.md
  - Cash & Bank: cash-bank.md
  - HR: hr.md
  - Payroll: payroll.md
  - Fixed Assets & Maintenance: fixed-assets.md
  - Manufacturing: manufacturing.md
  - Quality & Compliance: quality-compliance.md
  - Reports & Dashboards: reports.md
  - Service: service.md
  - Multi-Entity & Consolidation: multi-entity.md
  - Platform: platform.md
  - Deep-dives:
    - Overview: deep-dives/README.md
    - Payroll Runs: deep-dives/payroll-runs.md
    - Work Orders: deep-dives/work-orders.md
    - Journal Entries: deep-dives/journal-entries.md
    - Bank Reconciliation: deep-dives/bank-reconciliation.md
    - Tax Returns: deep-dives/tax-returns.md
    - Inter-Org Transfers: deep-dives/inter-org-transfers.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/elytz/robusta-docs
  generator: false

copyright: >
